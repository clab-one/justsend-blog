      "excerpt": "에이전트 작업 기록은 기능적으로는 완전했지만 목록에서 모두 긴 텍스트 카드처럼 보였다. 제목만으로는 작업을 구분하기 어려웠고, 완료 결과는 진행 노트 아래에 묻혔다. 대표 이미지 한 장을 붙이는 일처럼 보였지만 실제 변경은 tool input, process 간 staging, attachment 저장, list projection, detail rendering을 모두 건드렸다.\n기존 글은 결과를 1348자에 요약했다. corpus 깊이 기준에 못 미쳤고, 왜 renderer가 그림 내용을 결정하면 안 되는지와 `jsattach` 중복이 어떻게 생겼는지, running helper를 교체하다 연결을 끊은 실패가 빠졌다. 여기서는 image를 장식이 아닌 기록 데이터의 한 종류로 다룬다.\n## 먼저 “누가 무엇을 그리는가”를 나눴습니다",
