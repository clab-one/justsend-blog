      "selected": true,
      "reason": "0.4.3 새 run의 claim을 현재 source와 독립적으로 연결하기 위해 선택했다.",
      "artifact_kind": "corpus",
      "excerpt": "첫 실행 화면에 캘린더·마이크·카메라 토글을 둔 의도는 친절이었다. 사용자가 갑자기 시스템 프롬프트를 만나지 않도록 이유를 먼저 설명하고 싶었다. 그러나 App Store 5.1.1(iv) 심사는 그 화면을 설명서가 아니라 우회 가능한 관문으로 읽었다. 안내를 본 뒤에도 시스템 프롬프트로 항상 이어지지 않았고, 사용자는 권한 요청을 건너뛴 채 다음 화면으로 갈 수 있었다. 핵심은 “pre-prompt는 언제나 나쁘다”는 결론이 아니다. 앱이 만든 설명과 운영체제가 소유한 동의가 서로 다른 생명주기를 가지면, 설명이 실제 동의를 대신하는 것처럼 보일 수 있다는 점이다.\n기존 배포 글은 이 결론을 1478자 안에 요약했다. 같은 한국어 기술 글 corpus 중앙값 8203자의 60%에도 못 미쳤고, 어느 API를 확인했는지와 거부 뒤 복구가 왜 설정 앱이어야 하는지가 빠졌다. 반려 메일을 다시 풀어 쓰지 않고 작업 기록을 seed로 삼고 실제 화면·상태 모델·Apple 공식 계약·실기 관측을 한 흐름에 묶었다.\n## 먼저 네 가지를 분리했습니다",
