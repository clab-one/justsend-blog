<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="d001-title d001-desc" data-diagram-type="state-machine" data-primary-axis="states" data-renderer-id="justsend-state-machine-v1" data-renderer-version="1">
<title id="d001-title">notDetermined 권한 상태가 사용자 선택으로 granted 또는 blocked로 전이하고 blocked에서 Settings 복구 상태로 이어지는 lifecycle을 설명한다.</title><desc id="d001-desc">States and guarded transitions describe the lifecycle of the subject.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#363636"/></marker></defs><style>.paper{fill:#fff}.zone{fill:#f8f8f8;stroke:#c7c7c7;stroke-width:1}.zone-label{font:700 12px ui-sans-serif,system-ui;fill:#363636}.node{fill:#fff;stroke:#121212;stroke-width:1.2}.focal{fill:#e4f7a1}.node-label{font:600 12px ui-sans-serif,system-ui;fill:#121212;text-anchor:middle}.node-sub{font:500 8px ui-monospace,monospace;fill:#727272;text-anchor:middle}.edge{fill:none;stroke:#363636;stroke-width:1.2}.edge-label{font:500 8px ui-monospace,monospace;fill:#363636;text-anchor:middle}.label-mask{fill:#fff}.boundary{stroke:#121212;stroke-width:1.2;stroke-dasharray:6 4}.stage-number{font:700 10px ui-monospace,monospace;fill:#121212;text-anchor:middle}.title{font:700 20px ui-sans-serif,system-ui;fill:#121212}</style><rect width="960" height="560" class="paper"/><text x="48" y="48" class="title">notDetermined 권한 상태가 사용자 선택으로 granted 또는 blocked로 전이하고 blocked에서 Settings 복구 상태로 이어지는 lifecycle을 설명한다.</text><circle cx="48" cy="280" r="7" fill="#121212"/><path d="M 56 280 H 80" class="edge" marker-end="url(#arrow)"/><g data-edge-id="E001" data-from="not-determined" data-to="granted" data-edge-kind="transition" data-evidence-ids="JS-E102,JS-E103" data-route-points="232,268;296,268;296,176;360,176"><path d="M 232 268 H 296 V 176 H 360" class="edge" marker-end="url(#arrow)"/><rect x="288.5" y="116" width="79" height="14" rx="3" class="label-mask"/><text x="328" y="126" class="edge-label">allow</text></g><g data-edge-id="E002" data-from="not-determined" data-to="blocked" data-edge-kind="transition" data-evidence-ids="JS-E103,JS-E104" data-route-points="232,292;320,292;320,376;360,376"><path d="M 232 292 H 320 V 376 H 360" class="edge" marker-end="url(#arrow)"/><rect x="306" y="424" width="68" height="14" rx="3" class="label-mask"/><text x="340" y="434" class="edge-label">deny</text></g><g data-edge-id="E003" data-from="blocked" data-to="settings" data-edge-kind="transition" data-evidence-ids="JS-E104,JS-E106" data-route-points="512,376;680,376"><path d="M 512 376 H 680" class="edge" marker-end="url(#arrow)"/><rect x="516" y="316" width="160" height="14" rx="3" class="label-mask"/><text x="596" y="326" class="edge-label">open settings</text></g><g data-node-id="not-determined" data-node-role="state" data-shape="state" data-evidence-ids="JS-E103" data-bounds="80,244,152,72"><rect x="80" y="244" width="152" height="72" rx="36" class="node"/><text x="156" y="284" class="node-label">notDetermined</text></g><g data-node-id="granted" data-node-role="state" data-shape="state" data-evidence-ids="JS-E103" data-bounds="360,140,152,72"><rect x="360" y="140" width="152" height="72" rx="36" class="node focal"/><text x="436" y="180" class="node-label">granted</text></g><g data-node-id="blocked" data-node-role="state" data-shape="state" data-evidence-ids="JS-E103,JS-E104" data-bounds="360,340,152,72"><rect x="360" y="340" width="152" height="72" rx="36" class="node"/><text x="436" y="380" class="node-label">blocked</text></g><g data-node-id="settings" data-node-role="state" data-shape="state" data-evidence-ids="JS-E104,JS-E106" data-bounds="680,340,152,72"><rect x="680" y="340" width="152" height="72" rx="36" class="node"/><text x="756" y="380" class="node-label">Settings recovery</text></g></svg>