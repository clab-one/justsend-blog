      "excerpt": "심사 반려를 고친 새 빌드가 준비되면 재제출 버튼을 누르기 쉽다. 그러나 심사관이 받는 제품은 바이너리 하나가 아니다. App Store Connect가 연결한 build, Notes for Review, 개인정보 공개, 권한 purpose string, 구독 상품, 서버 기능과 실제 입력 순서가 합쳐져 한 제품이 된다. 하나라도 다른 시점을 가리키면 “코드는 고쳤는데 심사관은 옛 화면을 재현하는” 상태가 생긴다.\n기존 배포 글은 이 판단을 1415자에 압축했다. corpus 깊이 기준에 못 미쳤고, App Store 규정과 서버 신고 계약, 검증 harness가 만든 거짓 실패를 구분한 과정이 빠졌다. 감사는 체크리스트 항목 수보다 각 표면의 정본과 관측 방법을 연결하는 데 초점을 맞췄다.\n## 재제출 단위를 먼저 정의했습니다",
