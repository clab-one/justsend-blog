      "artifact_kind": "corpus",
      "excerpt": "`work_start`가 성공을 돌려준 직후 `work_note`를 호출했는데 본문이 사라졌다. 실패는 네트워크 timeout도 중복 retry도 아니었다. helper는 시작 의도를 받았지만 실제 기록과 item ID는 앱의 비동기 집행기가 나중에 만들었다. 그 사이 도착한 노트는 연결할 anchor가 없어서 큐에 들어가지도 못했다. 한 조사에서 이런 유실이 67건 확인됐다.\n기존 글은 “비동기 앵커 위의 동기 계약”이라는 결론을 1320자에 담았지만 ID를 언제 발급하는지, provisional 상태를 어떻게 복구하는지, MCP ToolSpec이 어느 경계를 지키는지가 없었다. 여기서는 외부의 동기 도구 계약과 내부의 비동기 intent executor 사이를 데이터 수명으로 설명한다.\n## 문제는 queue가 아니라 ID 수명이었습니다",
