<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="d001-title d001-desc" data-diagram-type="state-machine" data-primary-axis="states" data-renderer-id="justsend-state-machine-v1" data-renderer-version="1">
<title id="d001-title">MCP work anchor가 issued에서 provisional, live, dead로 전이하고 account 복원 guard에서 retry하는 상태 lifecycle을 설명한다.</title><desc id="d001-desc">States and guarded transitions describe the lifecycle of the subject.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#363636"/></marker></defs><style>.paper{fill:#fff}.zone{fill:#f8f8f8;stroke:#c7c7c7;stroke-width:1}.zone-label{font:700 12px ui-sans-serif,system-ui;fill:#363636}.node{fill:#fff;stroke:#121212;stroke-width:1.2}.focal{fill:#e4f7a1}.node-label{font:600 12px ui-sans-serif,system-ui;fill:#121212;text-anchor:middle}.node-sub{font:500 8px ui-monospace,monospace;fill:#727272;text-anchor:middle}.edge{fill:none;stroke:#363636;stroke-width:1.2}.edge-label{font:500 8px ui-monospace,monospace;fill:#363636;text-anchor:middle}.label-mask{fill:#fff}.boundary{stroke:#121212;stroke-width:1.2;stroke-dasharray:6 4}.stage-number{font:700 10px ui-monospace,monospace;fill:#121212;text-anchor:middle}.title{font:700 20px ui-sans-serif,system-ui;fill:#121212}</style><rect width="960" height="560" class="paper"/><text x="48" y="48" class="title">MCP work anchor가 issued에서 provisional, live, dead로 전이하고 account 복원 guard에서 retry하는 상태 lifecycle을 설명한다.</text><circle cx="48" cy="280" r="7" fill="#121212"/><path d="M 56 280 H 80" class="edge" marker-end="url(#arrow)"/><g data-edge-id="E001" data-from="issued" data-to="provisional" data-edge-kind="transition" data-evidence-ids="JS-E102,JS-E103" data-route-points="232,280;296,280"><path d="M 232 280 H 296" class="edge" marker-end="url(#arrow)"/><rect x="208" y="220" width="112" height="14" rx="3" class="label-mask"/><text x="264" y="230" class="edge-label">openWork</text></g><g data-edge-id="E002" data-from="provisional" data-to="live" data-edge-kind="transition" data-evidence-ids="JS-E104,JS-E106" data-route-points="448,280;512,280"><path d="M 448 280 H 512" class="edge" marker-end="url(#arrow)"/><rect x="400" y="220" width="160" height="14" rx="3" class="label-mask"/><text x="480" y="230" class="edge-label">materialize · retry</text></g><g data-edge-id="E003" data-from="live" data-to="dead" data-edge-kind="transition" data-evidence-ids="JS-E102" data-route-points="664,280;728,280"><path d="M 664 280 H 728" class="edge" marker-end="url(#arrow)"/><rect x="651" y="220" width="90" height="14" rx="3" class="label-mask"/><text x="696" y="230" class="edge-label">delete</text></g><g data-node-id="issued" data-node-role="state" data-shape="state" data-evidence-ids="JS-E102" data-bounds="80,244,152,72"><rect x="80" y="244" width="152" height="72" rx="36" class="node"/><text x="156" y="284" class="node-label">ID issued</text></g><g data-node-id="provisional" data-node-role="state" data-shape="state" data-evidence-ids="JS-E103" data-bounds="296,244,152,72"><rect x="296" y="244" width="152" height="72" rx="36" class="node focal"/><text x="372" y="284" class="node-label">provisional</text></g><g data-node-id="live" data-node-role="state" data-shape="state" data-evidence-ids="JS-E103,JS-E106" data-bounds="512,244,152,72"><rect x="512" y="244" width="152" height="72" rx="36" class="node"/><text x="588" y="284" class="node-label">live</text></g><g data-node-id="dead" data-node-role="state" data-shape="state" data-evidence-ids="JS-E102" data-bounds="728,244,152,72"><rect x="728" y="244" width="152" height="72" rx="36" class="node"/><text x="804" y="284" class="node-label">dead</text></g></svg>