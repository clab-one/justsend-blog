      "excerpt": "작업 기록에는 결정과 실패와 검증 시간이 남는다. 그래서 좋은 기술 글의 재료처럼 보인다. 그러나 기록만 요약하면 풍부한 글이 되지 않았다. 사건의 시간축은 있지만 실제 code, test, config, 공식 platform contract와 runtime observation이 빠졌다. 결과는 사실을 틀리지는 않지만 독자가 원인과 trade-off를 재구성할 수 없는 얕은 글이었다.\n기존 pipeline 글도 1804자였다. 같은 한국어 corpus 중앙값 8203자의 60%에 못 미쳤다. “Evidence Pack을 만든다”는 단계는 설명했지만 Evidence가 어디서 오는지, JustSend 기록 밖의 source를 어떻게 확보하는지, 사용한 claim만 quality gate에 세는지가 없었다. 문장 스타일보다 research 단계의 부재가 문제였다.\n## SoloMD가 풍부한 글을 만드는 위치부터 다시 봤습니다",
