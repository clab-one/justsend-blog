      "artifact_kind": "corpus",
      "excerpt": "Mac 앱의 MCP 기능은 별도 실행 파일을 필요로 했다. 초기 판단은 helper를 앱 번들에 넣은 채 App Store와 직접 배포를 모두 만족시키는 것이었다. 실제 서명과 업로드를 해 보니 TestFlight 자격과 helper 실행 자격이 충돌했다. 신원 key가 없으면 container가 서지 않았고, 필요한 자격을 넣으면 bare executable이 provisioning profile을 담을 수 없어 업로드 계약에서 막혔다.\n먼저 사실관계를 바로잡는다. 기존 1343자 글은 “helper를 앱에 포함한 공증 DMG”를 최종 결정처럼 썼다. 현재 정본은 다르다. 앱은 공증 DMG로 배포하고, helper는 번들 밖 `/usr/local/bin/justsend-mcp`에 설치하는 별도 universal ZIP으로 배포한다. 시간축을 지우고 옛 결론을 현재형으로 쓰면 배포 문서가 다시 틀린다.\n## 채널 선택 기준을 기능보다 먼저 세웠습니다",
