      "excerpt": "공개 DMG는 누구나 내려받아 mount할 수 있다. Mach-O, framework, resource, plist, entitlement, 문자열과 MCP protocol을 모두 분석할 수 있다. 그래서 감사 기준을 “공격자가 구현을 모른다”에 두지 않았다. 내부 구조와 파일 위치와 tool schema를 전부 알아도 사용자 데이터·계정·쓰기 권한이 보호돼야 한다.\n기존 글은 이 위협 모델을 1423자에 요약했지만 의도 큐가 왜 원격 쓰기 경계인지, `0177.0.0.1`이 왜 parser discrepancy를 만드는지, 수정 뒤 산출물을 왜 다시 구워야 하는지가 빠졌다. corpus 깊이를 채우기 위해 설명을 늘린 것이 아니라 발견→원인→수정→검증의 source artifact를 복원했다.\n## 공개 구현 위협 모델을 먼저 고정했습니다",
