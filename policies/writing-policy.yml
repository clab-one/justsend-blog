version: 1
language: ko

reader_contract:
  require_goal: true
  require_audience: true
  lead_with_reader_value: true
  state_expected_understanding_or_action: true

structure:
  one_message_per_section: true
  problem_before_solution: true
  headings_predict_flow: true
  details_after_decision: true
  preserve_constraints_and_tradeoffs: true
  require_section_evidence_ids: true

sentences:
  explicit_actor: preferred
  active_voice: preferred
  prefer_verbs_over_nominalizations: true
  remove_empty_metadiscourse: true
  concrete_actions_and_results: true
  consistent_terms: required
  expand_acronym_on_first_use: true

claims:
  exaggeration_without_evidence: forbidden
  unsupported_success_effect: forbidden
  uncertain_as_certain: forbidden
  required_provenance: direct-or-corroborated
  prohibited_marketing_terms:
    - 혁신적
    - 획기적
    - 압도적

research_gate:
  source_of_truth_order:
    - justsend-work-record
    - repository-source
    - official-primary-source
    - runtime-observation
    - existing-corpus
  production_minimum:
    total_selected_sources: 5
    source_kinds: 3
    repository_sources: 2
    official_primary_sources: 1
    runtime_observations: 1
    claim_keys: 5
  source_requirements:
    selected_excerpt_required: true
    locator_required: true
    claim_mapping_required: true
    rejected_source_reason_required: true
    external_search_required_for_external_platform_claims: true
    code_intelligence_required_for_implementation_claims: true
    runtime_evidence_required_for_result_claims: true
  prohibited:
    - justsend-only-production-article
    - search-snippet-as-evidence
    - unlinked-research-padding
    - secondary-source-when-primary-exists

quality_gate:
  profile: production
  corpus_parity:
    required_when_target_has_existing_posts: true
    minimum_median_character_ratio: 0.60
    compare_same_language: true
  long_form:
    minimum_characters: 4500
    minimum_h2_sections: 5
    minimum_h3_sections: 2
    minimum_artifact_blocks: 3
    minimum_code_or_log_blocks: 1
    minimum_direct_evidence_items: 3
    minimum_evidence_coverage: 0.65
    maximum_repeated_paragraph_ratio: 0.20
  completeness:
    require_observed_problem: true
    require_failed_attempt_or_rejected_alternative_when_evidenced: true
    require_decision_and_result: true
    require_remaining_limits: true
    reject_work_card_summary_as_article: true
    reject_padding_without_evidence: true
    flag_unused_high_value_evidence: true
  exemptions:
    user_approval_required: true
    reason_minimum_characters: 20
    implicit_or_agent_approved: forbidden

visual_gate:
  infer_from_section_semantics: true
  required_for:
    - architecture
    - sequence
    - data-flow
    - state-machine
    - deployment
    - trust-boundary
    - dependency
    - process
  visual_candidate_requires_rendered_diagram: true
  empty_visuals_allowed_only_without_candidates: true
  missing_attachment_is_not_a_no_diagram_reason: true
  all_nodes_and_edges_require_evidence: true

review_questions:
  - 독자가 첫 두 문단에서 변화와 가치를 식별할 수 있는가?
  - 각 section은 하나의 판단이나 동작만 설명하는가?
  - 수치와 결과는 실제 Evidence에 연결되는가?
  - 실패, 제약, trade-off가 성공 서사에서 사라지지 않았는가?
  - 같은 개념을 끝까지 같은 이름으로 부르는가?

provenance:
  research_source: toss-technical-writing
  usage: general-principles-only
  copied_text: false
  distributed_upstream_content: false
